services:
  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      PUID: 1000
      PGID: 1000

      # Audio only
      AUDIO_DOWNLOAD_DIR: /downloads

      # Keep playlists organized
      OUTPUT_TEMPLATE: "%(title)s.%(ext)s"
      OUTPUT_TEMPLATE_PLAYLIST: "%(playlist_title)s/%(title)s.%(ext)s"

      # Optional
      DEFAULT_THEME: dark
      MAX_CONCURRENT_DOWNLOADS: 2

      # Keep state
      STATE_DIR: /config

    volumes:
      # Phoniebox music library (user phoniebox, uid/gid 1000)
      - /home/phoniebox/RPi-Jukebox-RFID/shared/audiofolders:/downloads

      # MeTube database/settings
      - /home/phoniebox/metube/config:/config
