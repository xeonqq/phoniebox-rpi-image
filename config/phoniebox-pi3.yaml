include:
  file: trixie-minbase.yaml

device:
  layer: rpi3
  hostname: phoniebox
  # Login credentials of the image. The password must satisfy:
  # >=8 chars, lower+upper case, digit, special char from @$!%*?&
  user1: phoniebox
  user1pass: Phoniebox1!

image:
  layer: image-rpios

layer:
  phoniebox: phoniebox

packages:
  - git
  - curl
  - wget
  - ca-certificates
  - python3
  - python3-venv
  - python3-pip
  - python3-dev
  - build-essential
  - pkg-config
  - libffi-dev
  - libssl-dev
  - libasound2-dev
  - alsa-utils
  - mpg123
  - ffmpeg
  - i2c-tools
  - spi-tools
  - rfkill
  - iw
  - wireless-tools
  - wpasupplicant
  # systemd user services (jukebox-daemon) need a working user manager:
  # without libpam-systemd, user@UID.service fails at first boot ("PAM
  # unable to dlopen(pam_systemd.so)", "$XDG_RUNTIME_DIR is not set") and
  # the unattended installer aborts. dbus-user-session provides the
  # $XDG_RUNTIME_DIR/bus socket that D-Bus user clients expect.
  - libpam-systemd
  - dbus-user-session
  - dnsmasq
  # The access point is run by hostapd: NetworkManager cannot create one
  # with the brcmfmac driver of the Pi 3 ("key setting validation failed").
  - hostapd
  - rsync
  - sudo
  - avahi-daemon
  - raspi-config
  # NetworkManager is required by the Phoniebox autohotspot feature.
  # Installed as a package (NOT the "network-manager" layer) because that
  # layer provides the "network-activator" capability already provided by
  # systemd-net-min (required by trixie-minbase), causing a provider
  # conflict at build time. The phoniebox-firstboot script activates
  # NetworkManager at boot (disables networkd, masks iwd).
  - network-manager
  - docker.io
  - docker-compose
