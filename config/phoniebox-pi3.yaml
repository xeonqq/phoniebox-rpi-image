include:
  file: trixie-minbase.yaml

device:
  layer: rpi3
  hostname: phoniebox
  # Login credentials of the image. The password must satisfy:
  # >=8 chars, lower+upper case, digit, special char from @$!%*?&
  user1: phoniebox
  user1pass: Phoniebox1!

image:
  layer: image-rpios

layer:
  phoniebox: phoniebox
  # NetworkManager is required by the Phoniebox autohotspot feature
  # (trixie-minbase would otherwise use systemd-networkd + iwd)
  net: network-manager

packages:
  - git
  - curl
  - wget
  - ca-certificates
  - python3
  - python3-venv
  - python3-pip
  - python3-dev
  - build-essential
  - pkg-config
  - libffi-dev
  - libssl-dev
  - libasound2-dev
  - alsa-utils
  - mpg123
  - ffmpeg
  - i2c-tools
  - spi-tools
  - rfkill
  - iw
  - wireless-tools
  - wpasupplicant
  - dnsmasq
  - rsync
  - sudo
  - avahi-daemon
  - raspi-config
